name: recapture-on-release

# Manually captures an explicitly selected CLI/MCP package pair:
# installs both exact versions, regenerates captured-help/ and the
# skill reference tables, bumps the frontmatter version pins, and runs the
# static gate. It NEVER auto-merges — a human reviews the capture diff and the
# manual-prose checklist in the PR body (issue #8).
#
# This job installs the CLI, so it is deliberately SEPARATE from evals.yml,
# which is intentionally zero-dependency (installs no CLI). Runs on Linux so
# Python writes LF and the captures match the committed eol=lf blobs with no
# CRLF churn.

on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Exact verified PPDS.Cli package version'
        required: true
        type: string
      mcp_version:
        description: 'Exact verified PPDS.Mcp package version'
        required: true
        type: string

# Least privilege: needs to push the branch and open the PR, nothing else.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: recapture-on-release
  cancel-in-progress: false

jobs:
  recapture:
    # Maintenance runtimes; consumer Python 3.8 remains covered by evals.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/ppds-dotnet
        with:
          dotnet-version: '10.0.404'

      - name: Validate requested tool versions
        id: ver
        shell: bash
        env:
          REQUESTED_CLI_VERSION: ${{ inputs.cli_version }}
          REQUESTED_MCP_VERSION: ${{ inputs.mcp_version }}
          LC_ALL: C
        run: |
          set -euo pipefail
          # Exact PPDS SemVer literals; same grammar as the release-input guard.
          numeric='(0|[1-9][0-9]*)'
          prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          build='[0-9A-Za-z-]+'
          version_re="^${numeric}\.${numeric}\.${numeric}(-${prerelease}(\.${prerelease})*)?(\+${build}(\.${build})*)?$"
          if ! [[ "$REQUESTED_CLI_VERSION" =~ $version_re ]]; then
            echo "::error::Invalid requested CLI version literal"
            exit 1
          fi
          if ! [[ "$REQUESTED_MCP_VERSION" =~ $version_re ]]; then
            echo "::error::Invalid requested MCP version literal"
            exit 1
          fi
          printf 'cli_version=%s\nmcp_version=%s\n' "$REQUESTED_CLI_VERSION" "$REQUESTED_MCP_VERSION" >> "$GITHUB_OUTPUT"
          # Always capture the selected pair, including MCP-only or same-version runs.

      - name: Install released PPDS tools
        env:
          TARGET_CLI_VERSION: ${{ steps.ver.outputs.cli_version }}
          TARGET_MCP_VERSION: ${{ steps.ver.outputs.mcp_version }}
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install -g PPDS.Cli --version "$TARGET_CLI_VERSION"
          dotnet tool install -g PPDS.Mcp --version "$TARGET_MCP_VERSION"
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Re-capture + bump frontmatter
        shell: bash
        run: |
          set -euo pipefail
          ppds --version
          python tools/recapture.py

      - name: Static gate
        shell: bash
        run: python evals/check_skills.py

      - name: Open PR if the captured surface changed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CLI_VERSION: ${{ steps.ver.outputs.cli_version }}
          TARGET_MCP_VERSION: ${{ steps.ver.outputs.mcp_version }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          # Post-normalization diff (eol=lf already applied on add): empty means
          # the new release left the captured surface byte-identical.
          if git diff --cached --quiet; then
            echo "No captured change for CLI $TARGET_CLI_VERSION / MCP $TARGET_MCP_VERSION — no PR needed."
            exit 0
          fi

          branch="recapture/cli-$TARGET_CLI_VERSION-mcp-$TARGET_MCP_VERSION"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore(captures): re-capture CLI $TARGET_CLI_VERSION / MCP $TARGET_MCP_VERSION"
          # Use the step-scoped GH_TOKEN for this push only; write no credential config.
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push -u origin "$branch" --force-with-lease

          body="$(cat <<EOF
          Manual re-capture against **PPDS CLI \`$TARGET_CLI_VERSION\` / MCP \`$TARGET_MCP_VERSION\`**, per #8.

          The capture scripts + frontmatter bump + \`check_skills.py\` ran green. **Do not merge without the manual review below** — the static gate verifies that cited commands/flags *exist*, not that the skill prose is still accurate or complete.

          ## Manual review checklist
          - [ ] Read the \`captured-help/\` diff: any **new / renamed / removed** command or flag that needs new *prose* in a skill (the gate won't tell you).
          - [ ] If the pin is now **stable**, drop \`--prerelease\` install guidance (\`README.md\`, \`skills/ppds-core/SKILL.md\`) and remove stale \`rc\` mentions (\`README.md\`, \`DESIGN.md\`, \`skills/*\`) — \`check_skills.py::check_prose_version_drift\` does NOT catch these on a stable pin.
          - [ ] Update \`CHANGELOG.md\`.
          - [ ] Bump \`.claude-plugin/plugin.json\` + \`marketplace.json\` if cutting a package release.
          - [ ] Close #8's first real run / link this PR to #2 if this is the v1.2 recapture.
          EOF
          )"
          gh pr create --title "chore(captures): CLI $TARGET_CLI_VERSION / MCP $TARGET_MCP_VERSION" \
            --body "$body" --label "type:docs,epic:agent-tooling" --base main --head "$branch"
