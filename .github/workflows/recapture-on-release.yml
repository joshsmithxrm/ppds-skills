name: recapture-on-release

# Held source proposal: manual default-branch dispatch only. The producer has
# read authority and no persisted checkout token. The writer consumes data in
# a fresh job using trusted code from the exact dispatch commit.
on:
  workflow_dispatch:
    inputs:
      cli_version:
        description: 'Exact verified PPDS.Cli package version'
        required: true
        type: string
      mcp_version:
        description: 'Exact verified PPDS.Mcp package version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recapture-on-release
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/ppds-dotnet
        with:
          dotnet-version: '10.0.404'

      - name: Validate requested tool versions
        id: ver
        shell: bash
        env:
          REQUESTED_CLI_VERSION: ${{ inputs.cli_version }}
          REQUESTED_MCP_VERSION: ${{ inputs.mcp_version }}
          LC_ALL: C
        run: |
          set -euo pipefail
          numeric='(0|[1-9][0-9]*)'
          prerelease='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          build='[0-9A-Za-z-]+'
          version_re="^${numeric}\.${numeric}\.${numeric}(-${prerelease}(\.${prerelease})*)?(\+${build}(\.${build})*)?$"
          if ! [[ "$REQUESTED_CLI_VERSION" =~ $version_re ]]; then
            echo "::error::Invalid requested CLI version literal"
            exit 1
          fi
          if ! [[ "$REQUESTED_MCP_VERSION" =~ $version_re ]]; then
            echo "::error::Invalid requested MCP version literal"
            exit 1
          fi
          printf 'cli_version=%s\nmcp_version=%s\n' "$REQUESTED_CLI_VERSION" "$REQUESTED_MCP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install released PPDS tools
        env:
          TARGET_CLI_VERSION: ${{ steps.ver.outputs.cli_version }}
          TARGET_MCP_VERSION: ${{ steps.ver.outputs.mcp_version }}
          PPDS_TOOL_DIR: ${{ runner.temp }}/ppds-tools
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$PPDS_TOOL_DIR" PPDS.Cli --version "$TARGET_CLI_VERSION"
          dotnet tool install --tool-path "$PPDS_TOOL_DIR" PPDS.Mcp --version "$TARGET_MCP_VERSION"
          echo "$PPDS_TOOL_DIR" >> "$GITHUB_PATH"

      - name: Capture in fresh staging directory
        env:
          TARGET_CLI_VERSION: ${{ steps.ver.outputs.cli_version }}
          TARGET_MCP_VERSION: ${{ steps.ver.outputs.mcp_version }}
          CAPTURE_STAGE: ${{ runner.temp }}/ppds-capture
          PPDS_CONFIG_DIR: ${{ runner.temp }}/ppds-empty-config
        shell: bash
        run: |
          set -euo pipefail
          python -c "import sys; assert sys.version_info[:3] == (3, 14, 10), sys.version"
          test "$(dotnet --version)" = '10.0.404'
          mkdir "$PPDS_CONFIG_DIR"
          python tools/recapture_artifact.py prepare --stage "$CAPTURE_STAGE"
          python "$CAPTURE_STAGE/tools/recapture.py"
          python "$CAPTURE_STAGE/evals/check_skills.py"

      - name: Seal data bundle
        id: bundle
        env:
          TARGET_CLI_VERSION: ${{ steps.ver.outputs.cli_version }}
          TARGET_MCP_VERSION: ${{ steps.ver.outputs.mcp_version }}
          CAPTURE_STAGE: ${{ runner.temp }}/ppds-capture
          PPDS_TOOL_DIR: ${{ runner.temp }}/ppds-tools
          BUNDLE_PATH: ${{ runner.temp }}/ppds-handoff/bundle.json
        shell: bash
        run: |
          set -euo pipefail
          export CAPTURE_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          digest="$(python tools/recapture_artifact.py pack --stage "$CAPTURE_STAGE" --store "$PPDS_TOOL_DIR/.store" --output "$BUNDLE_PATH")"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload data only
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ppds-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ppds-handoff/bundle.json
          if-no-files-found: error
          retention-days: 14

  write-pr:
    needs: capture
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Validate artifact selection
        env:
          ARTIFACT_ID: ${{ needs.capture.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.capture.outputs.artifact_id }}
          path: ${{ runner.temp }}/ppds-handoff
          merge-multiple: true

      # No artifact scripts, PPDS, installers or capture/generator entrypoints.
      - name: Validate and apply data only
        env:
          TARGET_CLI_VERSION: ${{ inputs.cli_version }}
          TARGET_MCP_VERSION: ${{ inputs.mcp_version }}
          BUNDLE_SHA256: ${{ needs.capture.outputs.bundle_sha256 }}
          ARTIFACT_DIR: ${{ runner.temp }}/ppds-handoff
          PATHS_OUTPUT: ${{ runner.temp }}/ppds-validated-paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          export CAPTURE_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          python tools/recapture_artifact.py apply --artifact-dir "$ARTIFACT_DIR" --sha256 "$BUNDLE_SHA256" --paths-output "$PATHS_OUTPUT"

      - name: Open draft PR if validated data changed
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_CLI_VERSION: ${{ inputs.cli_version }}
          TARGET_MCP_VERSION: ${{ inputs.mcp_version }}
          BUNDLE_SHA256: ${{ needs.capture.outputs.bundle_sha256 }}
          PATHS_OUTPUT: ${{ runner.temp }}/ppds-validated-paths
          PR_BODY: ${{ runner.temp }}/ppds-capture-pr.md
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git add --pathspec-from-file="$PATHS_OUTPUT" --pathspec-file-nul
          if git diff --cached --quiet; then
            echo 'No validated capture change - no PR needed.'
            exit 0
          fi
          branch="recapture/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git -c core.hooksPath=/dev/null commit -m "chore(captures): CLI $TARGET_CLI_VERSION / MCP $TARGET_MCP_VERSION"
          # The token is supplied only to this Git process; checkout never persists it.
          header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin "HEAD:refs/heads/$branch"
          cat > "$PR_BODY" <<EOF
          Manual capture of CLI $TARGET_CLI_VERSION / MCP $TARGET_MCP_VERSION.

          Source: $GITHUB_SHA
          Producer run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT
          Data bundle SHA256: $BUNDLE_SHA256

          The read-only producer captured full MCP schemas and protocol records and passed the static gate. The clean writer validated only data against this exact source, run, attempt and pair. Package hashes are producer observations; they do not independently prove public package authenticity.

          - [ ] Review command/flag/tool additions and removals, full schemas, effective versions and package/source receipts in the run artifact.
          - [ ] Review deleted candidate-only platform records; replace source-only assertions only with fresh evidence.
          - [ ] Update candidate-provenance.json for the new evidence; never relabel the retained alpha evidence as stable.
          - [ ] Review prose, stable install guidance, CHANGELOG and plugin versions separately.
          - [ ] Run ordinary PR validation before considering merge. A GITHUB_TOKEN PR may require a maintainer close/reopen to trigger it.
          EOF
          gh pr create --draft --title "chore(captures): CLI $TARGET_CLI_VERSION / MCP $TARGET_MCP_VERSION" --body-file "$PR_BODY" --base "$DEFAULT_BRANCH" --head "$branch"
